[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]

name = "metaforecast"
version = "0.2.2"
authors = [
    { name = "Vitor Cerqueira", email = "cerqueira.vitormanuel@gmail.com" },
]
keywords = [
    "Machine Learning",
    "Data Science",
    "Time Series",
    "Forecasting"
]
description = "Meta-learning and Data-centric Forecasting"
readme = "README.md"
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

dependencies = [
    "arch==7.2.0",
    "lightgbm==4.5.0",
    "tslearn==0.6.3",
    "datasetsforecast==0.0.8",
    "neuralforecast==1.7.5",
    "statsforecast==1.7.5",
    "mlforecast==0.13.4",
    "pytorch_lightning==2.3.3",
]

[project.optional-dependencies]
dev = [
    "ruff",
    "pytest",
    "pre-commit",
    "bump2version",
]
docs = [
    "sphinx",
    "sphinx-rtd-theme",
    "sphinx-copybutton",
    "nbsphinx",
    "nbsphinx-link",
    "IPython",
]

[project.urls]
"Homepage" = "https://github.com/vcerqueira/metaforecast"
"Bug Tracker" = "https://github.com/vcerqueira/metaforecast/issues"

[tool.hatch.build.targets.wheel]
packages = ["metaforecast"]

# ---------- Ruff (replaces isort + black + pylint) ----------

[tool.ruff]
line-length = 100
target-version = "py39"
exclude = [
    ".git",
    ".venv",
    "__pycache__",
    "docs/build",
    "dist",
    "*.egg-info",
]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific rules
]
ignore = [
    "E501",   # line length (handled by formatter)
    "B905",   # zip without strict= (py3.9 compat)
]

[tool.ruff.lint.isort]
known-first-party = ["metaforecast"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

# ---------- pytest ----------

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::FutureWarning",
]

# ---------- bump2version ----------

[tool.bumpversion]
current_version = "0.2.2"
commit = true
tag = true

[[tool.bumpversion.files]]
filename = "pyproject.toml"
search = 'version = "{current_version}"'
replace = 'version = "{new_version}"'

[[tool.bumpversion.files]]
filename = "metaforecast/__init__.py"
search = '__version__ = "{current_version}"'
replace = '__version__ = "{new_version}"'
