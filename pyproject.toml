[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]

name = "metaforecast"
version = "0.3.0"
authors = [
    { name = "Vitor Cerqueira", email = "cerqueira.vitormanuel@gmail.com" },
]
keywords = [
    "Machine Learning",
    "Data Science",
    "Time Series",
    "Forecasting"
]
description = "Meta-learning and Data-centric Forecasting"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11,<3.14"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Operating System :: OS Independent",
]

dependencies = [
    "arch==8.0.0",
    "pandas>=3,<4",
    "catboost==1.2.10",
    "tslearn==0.6.4",
    "utilsforecast==0.2.15",
    "neuralforecast==3.1.2",
    "statsforecast==2.0.3",
    "mlforecast==1.0.2",
    "pytorch_lightning==2.5.6",
    "tsfeatures==0.4.5",
    "pandas-stubs~=3.0.5",
]

[project.optional-dependencies]
dev = [
    "ruff",
    "pytest",
    "bump-my-version",
]
docs = [
    "sphinx>=7,<8",
    "sphinx-rtd-theme",
    "sphinx-copybutton",
    "nbsphinx",
    "nbsphinx-link",
    "IPython",
]

[project.urls]
"Homepage" = "https://github.com/vcerqueira/metaforecast"
"Bug Tracker" = "https://github.com/vcerqueira/metaforecast/issues"

[tool.hatch.build.targets.wheel]
packages = ["metaforecast"]

# ---------- Ruff (replaces isort + black + pylint) ----------

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [
    ".git",
    ".venv",
    "__pycache__",
    "docs/build",
    "dist",
    "*.egg-info",
    "notebooks",
]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific rules
]
ignore = [
    "E501",    # line length (handled by formatter)
    "B905",    # zip without strict=
    "B008",    # function calls in default args (common in ML APIs)
    "RUF012",  # mutable class-level defaults (ubiquitous in data science code)
    "RUF001",  # ambiguous unicode characters (false positive on en-dash in copyright)
    "UP006",   # keep existing typing generics
    "UP035",   # keep existing typing imports
]

[tool.ruff.lint.isort]
known-first-party = ["metaforecast"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

# ---------- pytest ----------

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::FutureWarning",
]

# ---------- bump-my-version ----------

[tool.bumpversion]
current_version = "0.3.0"
commit = true
tag = true

[[tool.bumpversion.files]]
filename = "pyproject.toml"
search = 'version = "{current_version}"'
replace = 'version = "{new_version}"'

[[tool.bumpversion.files]]
filename = "metaforecast/__init__.py"
search = '__version__ = "{current_version}"'
replace = '__version__ = "{new_version}"'

[[tool.bumpversion.files]]
filename = "docs/source/conf.py"
search = 'release = "{current_version}"'
replace = 'release = "{new_version}"'
